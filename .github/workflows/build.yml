name: Build Applications (macOS & Windows)

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # --- JOB 1 : MACOS (.dmg autonomes) ---
  build-mac:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurer Python & Node.js
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        npm install gpmf-extract gopro-telemetry
        brew install create-dmg

    - name: Télécharger le binaire Node.js autonome pour macOS
      run: |
        NODE_PATH=$(which node)
        cp "$NODE_PATH" ./node
        chmod +x ./node

    - name: Compiler .app et .dmg
      run: |
        pyinstaller --noconsole --onefile \
          --add-binary "node:." \
          --add-data "index_gpx.js:." \
          --add-data "index_csv.js:." \
          --add-data "node_modules:node_modules" \
          --name "GoProTelemetryExtractor" \
          app_gui.py

        create-dmg \
          --volname "GoPro Telemetry Extractor" \
          --window-pos 200 120 \
          --window-size 600 400 \
          --icon-size 100 \
          --icon "GoProTelemetryExtractor.app" 175 120 \
          --hide-extension "GoProTelemetryExtractor.app" \
          --app-drop-link 425 120 \
          "dist/GoProTelemetryExtractor.dmg" \
          "dist/GoProTelemetryExtractor.app" || true

    - name: Publier le .dmg sur GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GoProTelemetryExtractor.dmg
        tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || 'v1.0.0' }}
        name: GoPro Telemetry Extractor ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || 'v1.0.0' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # --- JOB 2 : WINDOWS (.exe autonome) ---
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configurer Python & Node.js
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        npm install gpmf-extract gopro-telemetry

    - name: Copier l'exécutable Node.js Windows
      shell: powershell
      run: |
        $nodePath = (Get-Command node).Source
        Copy-Item $nodePath -Destination .\node.exe

    - name: Compiler le .exe
      run: |
        pyinstaller --noconsole --onefile --add-binary "node.exe;." --add-data "index_gpx.js;." --add-data "index_csv.js;." --add-data "node_modules;node_modules" --name "GoProTelemetryExtractor" app_gui.py

    - name: Publier le .exe sur GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/GoProTelemetryExtractor.exe
        tag_name: ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || 'v1.0.0' }}
        name: GoPro Telemetry Extractor ${{ github.ref_name != 'main' && github.ref_name != 'master' && github.ref_name || 'v1.0.0' }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
